name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Cliente (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build de producción
        run: npm run build

      - name: Pruebas unitarias (Vitest)
        run: npm run test

  server:
    name: Servidor (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: server/.python-version
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Instalar Tesseract OCR (motor nativo que usa pytesseract, T-02b)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Pruebas unitarias (pytest)
        run: pytest -v
