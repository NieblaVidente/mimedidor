# nginx — sirve el cliente y reenvía la API desde un mismo origen.
# Destino: /etc/nginx/sites-available/mimedidor  (enlazado en sites-enabled)

server {
    listen 80;
    listen [::]:80;
    server_name _;          # reemplazar por el dominio cuando exista

    root /var/www/mimedidor;
    index index.html;

    # ── Por qué las dos piezas van en el mismo origen ───────────────────────────────────
    # `client/src/api/*.ts` llama rutas relativas (`/api/...`), que asumen mismo origen —
    # es la misma razón por la que `vite.config.ts` necesita un proxy en desarrollo.
    # El servidor no monta CORS (ver `server/app/main.py`). Separar cliente y API en dos
    # orígenes obligaría a agregarlo, o sea a cambiar el contrato de la interfaz.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las fotos del hidrómetro se suben por multipart y pesan varios MB: las del
        # dataset de campo van de 0,7 a 4,6 MB. El límite por defecto de nginx es 1 MB y
        # rechazaría la mayoría con un 413 que el cliente hoy no distingue de otro error.
        client_max_body_size 15M;

        # El reconocimiento (OpenCV + Tesseract) corre dentro de la misma petición.
        proxy_read_timeout 120s;
    }

    # Aplicación de una sola página: cualquier ruta desconocida devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
