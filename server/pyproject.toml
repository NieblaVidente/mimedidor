[project]
name = "mimedidor-server"
version = "0.1.0"
description = "API backend y procesamiento de imagen de MiMedidor"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
