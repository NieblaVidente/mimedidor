[project]
name = "mimedidor-server"
version = "0.1.0"
description = "API backend y procesamiento de imagen de MiMedidor"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: ruff no reconoce Depends(...) como el patrón válido de FastAPI para valores por
# defecto — es la forma correcta de declarar dependencias, no un bug real (T-15).
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
